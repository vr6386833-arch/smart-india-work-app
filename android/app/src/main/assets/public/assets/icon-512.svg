<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle glow circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#34d399" stroke-width="8" opacity="0.3"/>
  <circle cx="256" cy="256" r="160" fill="#0f172a" opacity="0.6"/>

  <!-- Tricolor accent arc -->
  <path d="M 120 180 A 150 150 0 0 1 392 180" fill="none" stroke="#ff9933" stroke-width="14" stroke-linecap="round"/>
  <path d="M 120 332 A 150 150 0 0 0 392 332" fill="none" stroke="#138808" stroke-width="14" stroke-linecap="round"/>

  <!-- Center Shield Icon -->
  <path d="M 256 140 L 340 180 V 270 C 340 330 256 375 256 375 C 256 375 172 330 172 270 V 180 Z" fill="#059669" stroke="#10b981" stroke-width="6"/>

  <!-- Tool Symbol (Wrench & Hammer Cross) -->
  <path d="M 230 210 L 282 262 M 282 210 L 230 262" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="236" r="28" fill="url(#goldGrad)"/>
  <circle cx="256" cy="236" r="14" fill="#0f172a"/>

  <!-- Indian Rupee Badge -->
  <circle cx="340" cy="320" r="36" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4"/>
  <text x="340" y="334" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#0f172a" text-anchor="middle">₹</text>

  <!-- Bottom Brand Text -->
  <text x="256" y="440" font-family="'Noto Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="32" fill="#ffffff" text-anchor="middle" letter-spacing="1">SMART INDIA</text>
  <text x="256" y="470" font-family="'Noto Sans', 'Segoe UI', sans-serif" font-weight="600" font-size="20" fill="#34d399" text-anchor="middle">WORK APP</text>
</svg>
