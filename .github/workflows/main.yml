name: Build Android AAB for Play Store

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund || npm install --force --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Assets to Android
        env:
          CI: "true"
          CAPACITOR_TELEMETRY: "false"
        run: |
          # Sync via capacitor if available, but never fail
          npx --yes @capacitor/cli sync android || ./node_modules/.bin/cap sync android || true
          # Guaranteed copy of dist files directly into Android public assets
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/
          cp -f capacitor.config.json android/app/src/main/assets/capacitor.config.json 2>/dev/null || true

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android Release & Debug Keystores
        run: |
          mkdir -p ~/.android
          mkdir -p android/capacitor-cordova-android-plugins/src/main/libs
          # Verify keystore password, recreate if invalid
          if [ -f android/app/release.keystore ]; then
            keytool -list -keystore android/app/release.keystore -storepass smartindiawork >/dev/null 2>&1 || rm -f android/app/release.keystore
          fi
          if [ ! -f android/app/release.keystore ]; then
            echo "Generating fresh release keystore..."
            keytool -genkeypair -v -keystore android/app/release.keystore -storepass smartindiawork -alias releasekey -keypass smartindiawork -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Smart India Work, O=Smart India Work, C=IN" -noprompt
          fi
          chmod 644 android/app/release.keystore
          cp -f android/app/release.keystore android/app/debug.keystore || true
          cp -f android/app/release.keystore ~/.android/debug.keystore || true

      - name: Setup Android SDK and Local Properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=3 "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release AAB (Play Store)
        run: |
          cd android
          ./gradlew bundleRelease -x lint -x test -x lintVitalRelease -x lintVitalAnalyzeRelease -x checkReleaseAarMetadata --no-daemon 2>&1 | tee /tmp/gradle_aab.log || {
            echo "================== EXACT ERROR =================="
            grep -B 2 -A 15 "\* What went wrong:" /tmp/gradle_aab.log || tail -n 35 /tmp/gradle_aab.log
            echo "================================================="
            exit 1
          }

      - name: Build Release APK (Direct Install)
        run: |
          cd android
          ./gradlew assembleRelease -x lint -x test -x lintVitalRelease -x lintVitalAnalyzeRelease -x checkReleaseAarMetadata --no-daemon 2>&1 | tee /tmp/gradle_apk.log || {
            echo "================== EXACT ERROR =================="
            grep -B 2 -A 15 "\* What went wrong:" /tmp/gradle_apk.log || tail -n 35 /tmp/gradle_apk.log
            echo "================================================="
            exit 1
          }

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-output
          # Find and copy generated AAB
          find android/app/build/outputs/bundle -name "*.aab" -exec cp -vf {} release-output/SmartIndiaWork-PlayStore.aab \; || true
          # Find and copy generated APK
          find android/app/build/outputs/apk -name "*.apk" -exec cp -vf {} release-output/SmartIndiaWork-DirectInstall.apk \; || true
          echo "=== Files ready in release-output ==="
          ls -lh release-output/

      - name: Upload AAB (Google Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: SmartIndiaWork-PlayStore-AAB
          path: release-output/SmartIndiaWork-PlayStore.aab
          if-no-files-found: error

      - name: Upload APK (Direct Mobile Install)
        uses: actions/upload-artifact@v4
        with:
          name: SmartIndiaWork-APK
          path: release-output/SmartIndiaWork-DirectInstall.apk
          if-no-files-found: warn

      - name: Publish Direct Release (Play Store AAB & APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-release
          name: "Smart India Work - Play Store Ready AAB & APK"
          body: |
            ## Smart India Work - Production Release
            - **Google Play Store**: `SmartIndiaWork-PlayStore.aab`
            - **Direct Phone Install**: `SmartIndiaWork-DirectInstall.apk`
          draft: false
          prerelease: false
          files: |
            release-output/SmartIndiaWork-PlayStore.aab
            release-output/SmartIndiaWork-DirectInstall.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

