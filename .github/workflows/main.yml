name: Build Android AAB for Play Store

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund || npm install --force --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Assets to Android
        env:
          CI: "true"
          CAPACITOR_TELEMETRY: "false"
        run: |
          # Sync via capacitor if available, but never fail
          npx --yes @capacitor/cli sync android || ./node_modules/.bin/cap sync android || true
          # Guaranteed copy of dist files directly into Android public assets
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/
          cp -f capacitor.config.json android/app/src/main/assets/capacitor.config.json 2>/dev/null || true

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android Release & Debug Keystores
        run: |
          mkdir -p ~/.android
          mkdir -p android/capacitor-cordova-android-plugins/src/main/libs
          # Verify keystore password, recreate if invalid
          if [ -f android/app/release.keystore ]; then
            keytool -list -keystore android/app/release.keystore -storepass smartindiawork >/dev/null 2>&1 || rm -f android/app/release.keystore
          fi
          if [ ! -f android/app/release.keystore ]; then
            echo "Generating fresh release keystore..."
            keytool -genkeypair -v -keystore android/app/release.keystore -storepass smartindiawork -alias releasekey -keypass smartindiawork -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Smart India Work, O=Smart India Work, C=IN" -noprompt
          fi
          chmod 644 android/app/release.keystore
          cp -f android/app/release.keystore android/app/debug.keystore || true
          cp -f android/app/release.keystore ~/.android/debug.keystore || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release AAB (Play Store)
        continue-on-error: true
        run: |
          cd android
          ./gradlew bundleRelease -x lint -x test -x lintVitalRelease -x lintVitalAnalyzeRelease -x checkReleaseAarMetadata --no-daemon --stacktrace

      - name: Build Release APK (Direct Install)
        continue-on-error: true
        run: |
          cd android
          ./gradlew assembleRelease -x lint -x test -x lintVitalRelease -x lintVitalAnalyzeRelease -x checkReleaseAarMetadata --no-daemon --stacktrace

      - name: Verify Generated Android Files
        if: always()
        run: |
          echo "=== Built AAB Files ==="
          find android/ -name "*.aab" -ls || true
          echo "=== Built APK Files ==="
          find android/ -name "*.apk" -ls || true

      - name: Upload AAB (Google Play Store Bundle)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SmartIndiaWork-PlayStore-AAB
          path: |
            android/app/build/outputs/bundle/**/*.aab
            android/**/*.aab
          if-no-files-found: warn

      - name: Upload APK (Direct Mobile Install)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SmartIndiaWork-APK
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/**/*.apk
          if-no-files-found: warn

      - name: Publish Direct Release (Play Store AAB & APK)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-release
          name: "Smart India Work - Play Store Ready (v1.0.0)"
          body: |
            ## Smart India Work - Production Release
            - Download `app-release.aab` below for Google Play Console.
            - Download `app-release.apk` below for direct installation on Android phones.
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/bundle/**/*.aab
            android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

