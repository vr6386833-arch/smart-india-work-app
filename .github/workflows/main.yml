name: Build Android AAB for Play Store

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund || npm install --force --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release AAB (Play Store) & APK
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease -x lint -x lintVitalRelease -x test --no-daemon

      - name: Upload AAB (Google Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: SmartIndiaWork-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK (Direct Mobile Install)
        uses: actions/upload-artifact@v4
        with:
          name: SmartIndiaWork-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
