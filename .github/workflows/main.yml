name: Build Android AAB for Play Store

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Configure debug signing for release build
        run: |
          sed -i 's/buildTypes {/buildTypes {\n        release {\n            signingConfig signingConfigs.debug\n        }/' android/app/build.gradle || true

      - name: Build Release AAB (Play Store) & APK
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease -x lint -x lintVitalRelease -x test --no-daemon

      - name: Upload AAB (Google Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: SmartIndiaWork-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload APK (Direct Mobile Install)
        uses: actions/upload-artifact@v4
        with:
          name: SmartIndiaWork-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
